name: "Setup Python"

inputs:
  install-zuzu-dependencies:
    default: "false"

runs:
  using: "composite"
  steps:
    # 버전은 체크아웃한 저장소의 .python-version 을 따른다. 이 액션은 모든 브랜치가 @master 로
    # 함께 쓰므로, 파일이 없는 브랜치(전환 전 브랜치·production)는 그동안 쓰던 3.11 로 돈다.
    - name: Resolve Python version
      id: python-version
      shell: bash
      run: |
        if [ -f .python-version ]; then
          version=$(head -n1 .python-version | tr -d '[:space:]')
        else
          version="3.11"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Python ${{ steps.python-version.outputs.version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.python-version.outputs.version }}
        architecture: "x64"

    - name: Setup uv
      shell: bash
      run: |
        pip install uv
        python --version ; uv --version

    - name: Cache .venv
      if: inputs.install-zuzu-dependencies == 'true'
      id: cache-venv
      uses: actions/cache@v4
      with:
        path: ./.venv
        # 다른 Python 버전으로 만든 .venv 를 복원하지 않게 버전을 키에 넣는다.
        key: venv-${{ runner.os }}-py${{ steps.python-version.outputs.version }}-${{ hashFiles('./uv.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-py${{ steps.python-version.outputs.version }}-

    - name: Check .venv
      id: check-venv
      shell: bash
      run: |
        if (uv run python3 -c "import django"); then
          echo "result=true" >> $GITHUB_OUTPUT
        else
          echo "result=false" >> $GITHUB_OUTPUT
          # 일주일이 지난 PR은 GitHub에 의해 .venv 캐시가 삭제되므로 재설치가 필요하다.
          # https://docs.github.com/en/actions/advanced-guides/caching-dependencies-to-speed-up-workflows#usage-limits-and-eviction-policy
          rm -rf .venv
        fi

    - name: zz deps_django
      if: inputs.install-zuzu-dependencies == 'true'
      shell: bash
      run: |
        ./vv deps_django
