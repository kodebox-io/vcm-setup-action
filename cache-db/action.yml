name: "Cache Database"

inputs:
  github-token:
    default: ""
  db-snapshot-artifact-run-id:
    default: ""

runs:
  using: "composite"
  steps:
    - name: Cache DB migration datas
      id: cache-db
      uses: actions/cache@v4
      with:
        path: ./db-volume.tar
        key: db-${{ runner.os }}-${{ inputs.db-snapshot-artifact-run-id }}-${{ hashFiles('vcm/db/migrations/*.py') }}
        restore-keys: |
          db-${{ runner.os }}-${{ inputs.db-snapshot-artifact-run-id }}-

    - name: Extract the compressed DB migration datas
      if: steps.cache-db.outputs.cache-hit == 'true'
      shell: bash
      run: |
        sudo tar -xvf db-volume.tar

    - uses: kodebox-io/vcm-setup-action/setup-db-with-artifact@master
      if: steps.cache-db.outputs.cache-hit != 'true'
      with:
        github-token: ${{ inputs.github-token }}
        db-snapshot-artifact-run-id: ${{ inputs.db-snapshot-artifact-run-id }}

    - name: Compress the DB migration datas
      if: steps.cache-db.outputs.cache-hit != 'true'
      shell: bash
      run: |
        docker compose -f ./docker/testing.yaml up -d db
        for _ in $(seq 3); do yarn retry -t 1000 --max-timeout=60000 ./vv db_isready; sleep 1; done

        ./vv migrate --no-input
        ./vv backupdb postgres test_postgres

        # actions/cache에서는 'docker' usergroup이 소유하고 있는 파일에 접근할 수 없어, 부득이하게 Docker volume의 압축파일을 생성하여 캐시한다.
        # See https://github.com/actions/cache/issues/31
        #
        # 살아있는 postgres 의 데이터 디렉토리를 tar 하면 WAL 쓰기와 읽기가 겹쳐
        # "file changed as we read it" 으로 tar 가 exit 1 을 내고, 이 스텝이 간헐적으로 실패한다.
        # db 를 멈춰 데이터 디렉토리를 정지시킨 뒤 tar 해야 레이스가 없고, clean shutdown 상태라
        # 복원 시에도 일관된(WAL replay 불필요) 스냅샷이 된다.
        docker compose -f ./docker/testing.yaml stop db
        sudo tar -cvf db-volume.tar ./db-volume
